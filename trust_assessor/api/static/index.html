1px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:#f5f7ff}.score{font-weight:800;color:var(--green)}.pill{display:inline-block;border-radius:99px;background:var(--green-soft);color:var(--green);padding:4px 8px;font-size:11px;font-weight:800}.pill.warn{background:var(--amber-soft);color:var(--amber)}.pill.bad{background:var(--red-soft);color:var(--red)}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 45px;gap:10px;align-items:center;font-size:12px}.bar{height:9px;background:#edf0f5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.bar.green i{background:var(--green)}.histogram{height:180px;display:flex;align-items:end;gap:4px;border-bottom:1px solid var(--line);padding:15px 0 0}.histogram i{flex:1;background:#7d91e9;min-height:2px;border-radius:3px 3px 0 0}.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px}.tabs button{background:transparent;padding:11px 13px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:800}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:24px}.detail-title{font:700 27px "Inter","Segoe UI",ui-sans-serif,system-ui,sans-serif;margin:5px 0}.score-hero{text-align:right}.score-hero strong{display:block;font:700 43px "Inter","Segoe UI",ui-sans-serif,system-ui,sans-serif;color:var(--green)}.notice{padding:12px 14px;border:1px solid #f0c77d;background:var(--amber-soft);color:#795019;border-radius:6px;margin-top:15px}.list{margin:8px 0 0;padding-left:19px;color:#4f5b70}.facts{display:grid;gap:8px}.fact{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eef0f4;padding:6px 0}.fact span:first-child{color:var(--muted)}.review-text{max-width:550px}.small{font-size:12px}.checkbox{accent-color:var(--blue)}.modal{position:fixed;inset:0;background:#101b2c99;display:grid;place-items:center;padding:20px;z-index:5}.modal-box{background:white;border-radius:8px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:24px}.modal-close{float:right;background:none;color:var(--muted);font-size:22px}.hidden{display:none!important}.loading{padding:45px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.range-line{display:grid;grid-template-columns:1fr 85px;gap:12px;align-items:center}.range-line input{width:100%}.code{background:#172033;color:#dce5ff;border-radius:6px;padding:14px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.error{color:var(--red)}

<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark"><i class="fa-solid fa-cart-shopping"></i></div><div><strong>E-commerce Product Trust Assessor</strong></div></div><nav class="nav"><button data-view="dashboard" class="active"><i class="fa-solid fa-chart-line"></i>Dashboard</button><button data-view="search"><i class="fa-solid fa-magnifying-glass"></i>Product Search</button><button data-view="compare"><i class="fa-solid fa-scale-balanced"></i>Compare</button><button data-view="history"><i class="fa-solid fa-clock-rotate-left"></i>Assessment History</button><button data-view="models"><i class="fa-solid fa-brain"></i>Model Insights</button><button data-view="methodology"><i class="fa-solid fa-sliders"></i>Methodology & Settings</button></nav></aside><div class="main"><header class="topbar"><div><h1 id="top-title">Dashboard</h1></div><div class="top-actions"><button class="btn secondary" id="reload"><i class="fa-solid fa-rotate"></i> Refresh</button><a class="btn secondary" href="/docs"><i class="fa-solid fa-code"></i> API docs</a></div></header><main class="content" id="app"><div class="loading">Loading workspace...</div></main></div></div><div id="modal" class="hidden"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v==null?'n/a':Number(v).toLocaleString(undefined,{maximumFractionDigits:1}),pct=v=>v==null?'n/a':`${(Number(v)*100).toFixed(0)}%`,score=v=>v==null?'n/a':Number(v).toFixed(1),money=v=>v==null?'not listed':`$${Number(v).toFixed(2)}`;
async function get(path,opt){const r=await fetch(path,opt);if(!r.ok)throw Error(await r.text());return r.json()}const state={view:'dashboard',product:null,productTab:'explanation',compare:[]};
function safe(fn){return Promise.resolve(fn()).catch(e=>{$('app').innerHTML=`<div class="card error"><h3>Could not load this view</h3><p>${esc(e.message)}</p></div>`})}function setNav(view,title,sub){state.view=view;$('top-title').textContent=title;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view!=='product')safe(()=>views[view]())}function card(title,body,cls='span-4'){return `<section class="card ${cls}"><h3>${title}</h3>${body}</section>`}function list(items,empty='None reported.'){return items?.length?`<ul class="list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="muted">${empty}</p>`}function fact(label,value){return `<div class="fact"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}function componentBars(comps){return `<div class="bars">${(comps||[]).map(c=>`<div class="bar-row"><span>${esc(c.label)}</span><div class="bar"><i style="width:${c.score==null?0:c.score}%"></i></div><strong>${c.score==null?'n/a':Number(c.score).toFixed(0)}</strong></div>`).join('')}</div>`}
function productRows(items,select=false){if(!items?.length)return '<div class="empty">No products match these filters.</div>';return `<div class="table-wrap"><table><thead><tr>${select?'<th></th>':''}<th>Product</th><th>Trust score</th><th>Grade</th><th>Confidence</th><th>Reviews</th><th>Avg star</th><th>Coverage</th></tr></thead><tbody>${items.map(p=>`<tr class="clickable" data-product="${esc(p.parent_asin)}">${select?`<td><input class="checkbox compare-check" type="checkbox" value="${esc(p.parent_asin)}" ${state.compare.includes(p.parent_asin)?'checked':''}></td>`:''}<td><strong>${esc(p.title)}</strong><br><span class="muted small">${esc(p.parent_asin)}${p.store?' · '+esc(p.store):''}</span></td><td class="score">${score(p.trust_score)}</td><td><span class="pill ${p.grade==='Low trust'?'bad':p.grade==='Moderate trust'?'warn':''}">${esc(p.grade||'Insufficient evidence')}</span></td><td>${esc(p.confidence||'n/a')}</td><td>${num(p.n_reviews)}</td><td>${p.mean_rating==null?'n/a':Number(p.mean_rating).toFixed(2)}</td><td>${pct(p.evidence_coverage)}</td></tr>`).join('')}</tbody></table></div>`}function bindProducts(){document.querySelectorAll('[data-product]').forEach(r=>r.onclick=e=>{if(e.target.classList.contains('compare-check'))return;loadProduct(r.dataset.product)});document.querySelectorAll('.compare-check').forEach(c=>c.onchange=()=>{state.compare=[...document.querySelectorAll('.compare-check:checked')].map(x=>x.value).slice(0,4);const b=$('compare-selected');if(b)b.disabled=state.compare.length<2})}
const views={
async dashboard(){const d=await get('/api/dashboard');if(!d.ready){$('app').innerHTML=card('No processed data found',`<p>Run the preparation, training, and assessment pipeline before using the dashboard.</p><pre class="code">python scripts/prepare_dataset.py
python scripts/train_models.py
python scripts/assess_products.py</pre>`,'span-12');return}const s=d.summary||{},f=d.review_flags||{},info=d.pipeline||{},stats=info.stats||{},ds=info.dataset||{},mm=info.models||{};const [rows,top,low]=await Promise.all([get('/api/products?limit=10&sort_by=n_reviews'),get('/api/products?limit=7&min_reviews=10&sort_by=trust_score'),get('/api/products?limit=7&min_reviews=10&sort_by=trust_score&descending=false')]);let bins=Array.from({length:12},(_,i)=>(s.scores||[]).filter(x=>x>=i*10&&x<(i+1)*10).length),maxBin=Math.max(...bins,1);$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow"></div><h2>Dashboard</h2></div></div><div class="chips"><span class="chip">Category: ${esc(ds.category||'n/a')}</span><span class="chip">Reviews: ${esc(stats.date_min||'?')} → ${esc(stats.date_max||'?')}</span><span class="chip">Sentiment: ${esc(stats.sentiment_method||'none')}</span><span class="chip">Signals: ${esc((stats.suspicion_method||'n/a').replaceAll('_',' '))}</span><span class="chip">Model: ${esc(mm.model_version||'not trained')}</span></div><div class="grid">${card('Products',`<div class="metric"><div class="value">${num(s.n_products)}</div><div class="hint">${num(s.n_scored)} scored</div></div>`,'span-3')}${card('Reviews analysed',`<div class="metric"><div class="value">${num(f.n_reviews)}</div><div class="hint">${num(f.n_flagged)} flagged for closer look</div></div>`,'span-3')}${card('Mean trust score',`<div class="metric"><div class="value">${score(s.mean_score)}</div><div class="hint">Median ${score(s.median_score)}</div></div>`,'span-3')}${card('Evidence coverage',`<div class="metric"><div class="value">${pct(s.mean_coverage)}</div><div class="hint">Share of configured weight with data</div></div>`,'span-3')}${card('Trust score distribution',`<div class="histogram">${bins.map((b,i)=>`<i title="${i*10}-${i*10+9}: ${b}" style="height:${Math.max(3,b/maxBin*100)}%"></i>`).join('')}</div><div class="sub small">Score bands from 0 to 100</div>`,'span-7')}${card('Grades',`<div class="bars">${Object.entries(s.grades||{}).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar green"><i style="width:${v/Math.max(s.n_products,1)*100}%"></i></div><strong>${v}</strong></div>`).join('')}</div>`,'span-5')}${card('Average component profile',componentBars(Object.entries(s.component_means||{}).map(([label,score])=>({label,score}))),'span-5')}${card('Highest scores',productMini(top.items),'span-3')}${card('Lowest scores',productMini(low.items.filter(x=>x.trust_score!=null)),'span-4')}${card('Most-reviewed products',productRows(rows.items),'span-12')}</div>`;bindProducts()},
async search(){const q=new URLSearchParams(location.search).get('q')||'';$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">Catalogue</div><h2>Product search</h2><div class="sub">Filter, inspect, and select products for comparison.</div></div></div><section class="card"><div class="toolbar"><input id="search-q" value="${esc(q)}" placeholder="Search title, brand, or product ID"><select id="search-grade"><option value="">All grades</option><option>High trust</option><option>Moderate trust</option><option>Low trust</option><option>Insufficient evidence</option></select><input id="min-reviews" type="number" min="0" placeholder="Min reviews" style="max-width:130px"><select id="search-sort"><option value="trust_score">Trust score</option><option value="n_reviews">Number of reviews</option><option value="mean_rating">Average rating</option><option value="evidence_coverage">Evidence coverage</option><option value="title">Title</option></select><label class="small"><input id="desc" type="checkbox" checked> Descending</label><button class="btn" id="do-search">Search</button></div><div id="search-results"><div class="loading">Loading products...</div></div></section>`;async function run(){const p=new URLSearchParams({q:$('search-q').value,limit:'200',sort_by:$('search-sort').value,descending:$('desc').checked,min_reviews:$('min-reviews').value||'0'});if($('search-grade').value)p.append('grade',$('search-grade').value);const r=await get('/api/products?'+p);$('search-results').innerHTML=`<div class="toolbar"><span class="muted">${num(r.total)} products</span><button class="btn secondary" id="compare-selected" disabled>Compare selected</button></div>${productRows(r.items,true)}`;bindProducts();$('compare-selected').onclick=()=>{state.compare=[...document.querySelectorAll('.compare-check:checked')].map(x=>x.value);setNav('compare','Compare products','Side-by-side product evidence')}}$('do-search').onclick=run;['search-q','min-reviews'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')run()});run()},
async compare(){let ids=state.compare.length?state.compare:(new URLSearchParams(location.search).get('ids')||'').split(',').filter(Boolean);if(ids.length>4)ids=ids.slice(0,4);state.compare=ids;$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">Decision support</div><h2>Compare products</h2><div class="sub">Pick two to four products. The selection stays shareable in the URL.</div></div></div><section class="card"><div class="toolbar"><input id="compare-q" placeholder="Search a product to add"><button class="btn secondary" id="compare-clear">Clear selection</button></div><div id="compare-suggestions"></div><div class="chips">${ids.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section><div id="compare-content" class="grid" style="margin-top:16px"><div class="loading span-12">${ids.length<2?'Add at least two products to see the comparison.':'Loading comparison...'}</div></div>`;if(ids.length>=2){const d=await get('/api/compare?ids='+encodeURIComponent(ids.join(','))),items=d.items.map(x=>x.product),assessments=d.items.map(x=>x.assessment),labels=items.map(x=>x.title.slice(0,24));$('compare-content').innerHTML=`${card('Component profile',`<div class="bars">${(assessments[0]?.components||[]).map((c,i)=>`<div class="bar-row"><span>${esc(c.label)}</span><div>${assessments.map((a,j)=>`<div class="bar" style="margin:3px 0"><i style="width:${a.components[i].score||0}%;background:${['#3657d6','#16845b','#d59636','#c13d4f'][j]}"></i></div>`).join('')}</div><strong>${assessments.map(a=>a.components[i].score==null?'n/a':Number(a.components[i].score).toFixed(0)).join(' / ')}</strong></div>`).join('')}</div><div class="small muted" style="margin-top:12px">${labels.map((x,i)=>`<span style="color:${['#3657d6','#16845b','#d59636','#c13d4f'][i]}">■ ${esc(x)}</span>`).join(' &nbsp; ')}</div>`,'span-6')}${card('Side by side',`<div class="table-wrap"><table><thead><tr><th>Metric</th>${items.map(x=>`<th>${esc(x.title.slice(0,28))}</th>`).join('')}</tr></thead><tbody>${[['Trust score',...assessments.map(a=>score(a.trust_score))],['Grade',...assessments.map(a=>a.grade)],['Confidence',...assessments.map(a=>a.confidence)],['Evidence coverage',...assessments.map(a=>pct(a.evidence_coverage))],['Reviews analysed',...items.map(x=>num(x.n_reviews))],['Mean rating',...items.map(x=>score(x.mean_rating))],['Catalogue rating',...items.map(x=>score(x.meta_avg_rating))],['Verified purchases',...items.map(x=>pct(x.verified_share))],['Positive sentiment',...items.map(x=>pct(x.sent_pos_share))],['Negative sentiment',...items.map(x=>pct(x.sent_neg_share))],['Suspicious signals',...items.map(x=>pct(x.suspicious_share))],['Price',...items.map(x=>money(x.price))],['Store',...items.map(x=>x.store||'not listed')]].map(row=>`<tr>${row.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th>${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`,'span-6')}${items.map((p,i)=>card(p.title,`<span class="pill">${esc(assessments[i].grade)}</span><h4>Strengths</h4>${list(assessments[i].strengths?.slice(0,3),'None highlighted.')}<h4>Warnings</h4>${list(assessments[i].warnings?.slice(0,3),'None raised.')}`,'span-3')).join('')}`}$('compare-clear').onclick=()=>{state.compare=[];views.compare()};$('compare-q').oninput=async e=>{if(e.target.value.length<2){$('compare-suggestions').innerHTML='';return}const r=await get('/api/products?q='+encodeURIComponent(e.target.value)+'&limit=8&min_reviews=1');$('compare-suggestions').innerHTML=r.items.filter(x=>!ids.includes(x.parent_asin)).map(x=>`<button class="btn ghost add-compare" data-id="${x.parent_asin}">${esc(x.title.slice(0,75))} · ${score(x.trust_score)}</button>`).join('');document.querySelectorAll('.add-compare').forEach(b=>b.onclick=()=>{if(!ids.includes(b.dataset.id)&&ids.length<4){state.compare=[...ids,b.dataset.id];views.compare()}})}},
history:async function(){const d=await get('/api/history');$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">Audit trail</div><h2>Assessment history</h2><div class="sub">Every batch, interactive reassessment, and reweighting run is retained.</div></div></div><div class="grid">${card('Assessment runs',`<div class="table-wrap"><table><thead><tr><th>Started UTC</th><th>Source</th><th>Products</th><th>Mean score</th><th>Config</th><th>Model</th></tr></thead><tbody>${(d.runs||[]).map(r=>`<tr><td>${esc(r.started)}</td><td>${esc(r.source)}</td><td>${num(r.n)}</td><td>${score(r.mean_score)}</td><td>${esc(r.config_hash)}</td><td>${esc(r.model_version||'-')}</td></tr>`).join('')}</tbody></table></div>`,'span-12')}${card('All assessments',`<div class="toolbar"><input id="history-asin" placeholder="Product ID"><select id="history-source"><option value="">All sources</option><option>batch</option><option>interactive</option><option>reweight</option></select><button class="btn" id="history-filter">Filter</button></div><div id="history-table">${historyRows(d.items)}</div>`,'span-12')}</div>`;$('history-filter').onclick=async()=>{const p=new URLSearchParams({limit:'500'});if($('history-asin').value)p.set('asin',$('history-asin').value);if($('history-source').value)p.set('source',$('history-source').value);$('history-table').innerHTML=historyRows((await get('/api/history?'+p)).items)};bindProducts()},
async models(){const d=await get('/api/models'),ds=d.dataset||{},st=d.stats||{},mm=d.models||{},rep=d.sentiment_report||{},hm=d.helpfulness_metrics,sh=d.helpfulness_shap,ar=d.anomaly_report,x=hm?.xgboost||{},b=hm?.baseline_logistic_regression||{};$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">Reproducibility and diagnostics</div><h2>Model insights</h2><div class="sub">Model outputs are explanations of patterns, not proof of authenticity.</div></div></div><div class="grid">${card('Data & model versions',fact('Dataset version',ds.dataset_version||'n/a')+fact('Source',ds.source||'n/a')+fact('Reviews / products',`${num(st.n_reviews)} / ${num(st.n_products)}`)+fact('Model version',mm.model_version||'not trained')+fact('Trained at',mm.trained_at||'n/a')+fact('Random seed',ds.seed||'n/a'),'span-6')}${card('Sentiment model',rep?fact('Method',rep.method)+fact('Reviews scored',num(rep.n_scored))+Object.entries(rep.label_distribution||{}).map(([k,v])=>fact('Share '+k,pct(v))).join('')+`<p class="muted small">${esc(rep.caveat||'')}</p>`:'<p class="muted">Sentiment analysis was not run.</p>','span-6')}${card('Helpfulness model: XGBoost + SHAP',hm?`<p class="sub">Target: helpful vote ≥ 1. This is not a measure of authenticity.</p><div class="table-wrap"><table><thead><tr><th>Metric</th><th>XGBoost</th><th>Logistic baseline</th></tr></thead><tbody>${[['ROC-AUC','roc_auc'],['PR-AUC','pr_auc'],['F1','f1'],['Precision','precision'],['Recall','recall'],['Accuracy','accuracy'],['Brier score','brier']].map(([l,k])=>`<tr><td>${l}</td><td>${x[k]?.toFixed?.(3)||x[k]||'-'}</td><td>${b[k]?.toFixed?.(3)||b[k]||'-'}</td></tr>`).join('')}</tbody></table></div><p class="muted small">${esc(hm.caveat||'')} ${esc(hm.split||'')}</p>`:'<p class="muted">Helpfulness model not trained.</p>','span-7')}${card('Training data',hm?fact('Train / validation / test',`${num(hm.n_train)} / ${num(hm.n_validation)} / ${num(hm.n_test)}`)+fact('Helpful rate train',pct(hm.positive_rate_train))+fact('Helpful rate test',pct(hm.positive_rate_test))+fact('Boosting rounds',hm.best_iteration)+fact('Features',hm.features?.length):'<p class="muted">No metrics available.</p>','span-5')}${card('Feature importance',sh?componentBars(sh.labels.map((label,i)=>({label,score:(sh.mean_abs_shap[i]/Math.max(...sh.mean_abs_shap))*100})))+'<p class="muted small">Mean absolute SHAP values on held-out reviews. XGBoost gain is available in the API response.</p>':'<p class="muted">No SHAP report available.</p>','span-6')}${card('Anomaly model',ar?fact('Algorithm',ar.algorithm)+fact('Trees / contamination',`${ar.n_estimators} / ${ar.contamination}`)+fact('Reviews fitted',num(ar.n_reviews_fitted))+fact('Flag threshold',ar.flag_threshold)+fact('Flagged reviews',`${num(ar.n_flagged_reviews)} (${pct(ar.share_flagged_reviews)})`)+`<p class="muted small">${esc(ar.evaluation||'')}</p>`:'<p class="muted">Suspicion uses transparent rules only.</p>','span-6')}${card('Rule catalogue',`<div class="table-wrap"><table><thead><tr><th>Signal</th><th>Weight</th><th>Share</th><th>Definition</th></tr></thead><tbody>${Object.entries(d.rule_catalog||{}).map(([k,m])=>`<tr><td>${esc(m.label)}</td><td>${m.weight}</td><td>${pct((d.rule_rates||{})[m.label])}</td><td>${esc(m.description)}</td></tr>`).join('')}</tbody></table></div>`,'span-12')}</div>`},
async methodology(){const d=await get('/api/methodology'),c=d.config;$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">Scoring framework</div><h2>Methodology & settings</h2><div class="sub">Weights are normalized to 100%; unavailable components are excluded, never imputed.</div></div></div><div class="grid">${card('How the Product Trust Score works',`<ol><li>Review, listing, and model outputs become eight normalized components from 0–100.</li><li>Missing components are excluded and remaining weights are renormalized. Evidence coverage reports the configured weight supported by data.</li><li>The weighted average is withheld when reviews or evidence are insufficient.</li><li>A red-flag cap can limit scores when authenticity signals are very poor.</li><li>Grades: High ≥ ${c.grade_high}, Moderate ≥ ${c.grade_moderate}. Confidence depends on review count and coverage.</li></ol>`,'span-6')}${card('Components',`<div class="bars">${d.components.map(x=>`<div class="component"><div style="display:flex;justify-content:space-between"><strong>${esc(x.label)}</strong><span>${pct(x.weight)}</span></div><p class="muted small">${esc(x.description)}</p></div>`).join('')}</div>`,'span-6')}${card('Scoring settings',`<div class="settings-grid">${Object.entries(c.weights).map(([k,v])=>`<label class="range-line"><span>${esc(d.components.find(x=>x.key===k)?.label||k)}</span><input data-setting="${k}" type="number" min="0" max="1" step=".01" value="${v}"></label>`).join('')}</div><div class="settings-grid" style="margin-top:16px"><label>Bayesian prior <input data-config="bayes_prior_weight" type="number" value="${c.bayes_prior_weight}"></label><label>Volume target <input data-config="volume_target" type="number" value="${c.volume_target}"></label><label>Minimum coverage <input data-config="min_coverage" type="number" min="0" max="1" step=".05" value="${c.min_coverage}"></label><label><input data-config="red_flag_cap_enabled" type="checkbox" ${c.red_flag_cap_enabled?'checked':''}> Red-flag cap</label></div><div class="toolbar"><button class="btn" id="save-settings">Save & re-score all products</button><button class="btn secondary" id="reset-settings">Reset defaults</button><span id="settings-status" class="muted"></span></div>`,'span-12')}${card('Limitations',list(d.limitations),'span-6')}${card('Deliberately not assessed',list((d.not_assessed||[]).map(x=>x.item+': '+x.reason))+'<hr><p class="muted small">Amazon Reviews 2023 (McAuley Lab), streamed from Hugging Face. Review text is analysed locally; nothing is scraped from live marketplaces.</p>','span-6')}</div>`;$('save-settings').onclick=async()=>{const out={...c,weights:{}};document.querySelectorAll('[data-setting]').forEach(i=>out.weights[i.dataset.setting]=Number(i.value));document.querySelectorAll('[data-config]').forEach(i=>out[i.dataset.config]=i.type==='checkbox'?i.checked:Number(i.value));$('settings-status').textContent='Re-scoring...';try{const r=await get('/api/methodology/rescore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});$('settings-status').textContent=`Done: ${num(r.n_products)} products re-scored.`}catch(e){$('settings-status').textContent=e.message}};$('reset-settings').onclick=()=>views.methodology()}
};
function productMini(items){return items?.length?items.map(p=>`<div class="fact clickable" data-product="${esc(p.parent_asin)}"><span>${esc(p.title.slice(0,55))}<br><small>${num(p.n_reviews)} reviews</small></span><strong class="score">${score(p.trust_score)}</strong></div>`).join(''):'<p class="muted">No products match.</p>'}function historyRows(items){return `<div class="table-wrap"><table><thead><tr><th>When UTC</th><th>Product</th><th>Score</th><th>Grade</th><th>Confidence</th><th>Source</th><th>Config</th></tr></thead><tbody>${(items||[]).map(r=>`<tr class="clickable" data-product="${esc(r.parent_asin)}"><td>${esc(r.created_at)}</td><td>${esc(r.title)}</td><td class="score">${score(r.trust_score)}</td><td>${esc(r.grade)}</td><td>${esc(r.confidence)}</td><td>${esc(r.source)}</td><td>${esc(r.config_hash)}</td></tr>`).join('')}</tbody></table></div>`}
async function loadProduct(asin){state.product=asin;$('top-title').textContent='Product details';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const d=await get('/api/products/'+encodeURIComponent(asin)+'?include_reviews=true&review_limit=1000');const p=d.product,a=d.assessment;$('app').innerHTML=`<div class="page-head"><button class="btn ghost" id="product-back">← Back to search</button><div></div></div><section class="card"><div class="detail-head"><div><div class="eyebrow">Product assessment</div><div class="detail-title">${esc(p.title)}</div><div class="sub">ID ${esc(p.parent_asin)} · ${esc(p.store||'Store not listed')} · ${esc(p.category||'Unknown category')} · ${money(p.price)}</div><div class="chips" style="margin:14px 0 0"><span class="pill">${esc(a.grade)}</span><span class="chip">${esc(a.confidence)} confidence</span><span class="chip">Evidence coverage ${pct(a.evidence_coverage)}</span><span class="chip">${num(p.n_reviews)} reviews analysed</span></div></div><div class="score-hero"><span class="label">Product Trust Score</span><strong>${score(a.trust_score)}</strong><button class="btn secondary" id="reassess">↻ Re-assess</button><button class="btn secondary" id="to-compare">⇄ Compare</button></div></div><p class="muted small">Assessed ${esc(a.created_at)} UTC · dataset ${esc(a.dataset_version||'n/a')} · models ${esc(a.model_version||'untrained')} · sentiment ${esc(a.sentiment_method||'none')} · config ${esc(a.config_hash)}</p>${a.adjustments?.length?`<div class="notice">${esc(a.adjustments.join(' '))}</div>`:''}</section><div class="tabs">${[['explanation','Score explanation'],['reviews','Review analytics'],['suspicious','Suspicious signals'],['listing','Listing quality'],['history','History']].map(x=>`<button data-tab="${x[0]}" class="${state.productTab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div id="product-tab"></div>`;$('product-back').onclick=()=>setNav('search','Product search','Filter, inspect, and compare products');$('reassess').onclick=async()=>{await get('/api/products/'+asin+'/reassess',{method:'POST'});loadProduct(asin)};$('to-compare').onclick=()=>{state.compare=[asin];setNav('compare','Compare products','Side-by-side product evidence')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.productTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderProductTab(d)});renderProductTab(d)}
function renderProductTab(d){const p=d.product,a=d.assessment,reviews=d.reviews||[],t=$('product-tab');if(state.productTab==='explanation')t.innerHTML=`<div class="grid">${card('How this score was calculated',list(a.explanation),'span-5')}${card('Component breakdown',componentBars(a.components),'span-7')}${card('Component details',`<div class="table-wrap"><table><thead><tr><th>Component</th><th>Score</th><th>Effective weight</th><th>Points</th><th>Evidence</th></tr></thead><tbody>${(a.decomposition||[]).map(x=>`<tr><td><strong>${esc(x.label)}</strong><br><small class="muted">${esc(x.description)}</small></td><td>${x.score==null?'n/a':Number(x.score).toFixed(0)}</td><td>${x.available?pct(x.effective_weight):'excluded'}</td><td>${Number(x.contribution||0).toFixed(1)}</td><td>${esc(x.evidence)}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Scoring is a transparent heuristic, not validated against ground truth.</p>`,'span-12')}${card('Strengths',list(a.strengths,'No component stands out as strong.'),'span-4')}${card('Warnings',list(a.warnings,'No warnings raised.'),'span-4')}${card('Missing information',list(a.missing,'All expected data was available.'),'span-4')}</div>`;else if(state.productTab==='reviews')renderReviews(d,false);else if(state.productTab==='suspicious')renderReviews(d,true);else if(state.productTab==='listing')t.innerHTML=`<div class="grid">${card('Listing completeness',Object.values(d.listing_fields||{}).map(x=>fact(x.label,x.present?'Present':'Missing')).join(''),'span-5')}${card('Catalogue content',`${d.catalogue.categories?.length?`<p class="muted">${esc(d.catalogue.categories.join(' › '))}</p>`:''}${d.catalogue.features?.length?`<h4>Features</h4>${list(d.catalogue.features.slice(0,8))}`:''}${p.description?`<h4>Description</h4><p>${esc(String(p.description).slice(0,900))}</p>`:''}${Object.keys(d.catalogue.details||{}).length?`<h4>Details</h4>${Object.entries(d.catalogue.details).map(([k,v])=>fact(k,v)).join('')}`:''}`,'span-7')}</div>`;else get('/api/history?asin='+encodeURIComponent(p.parent_asin)+'&limit=200').then(h=>t.innerHTML=`<div class="card"><h3>Score history for this product</h3>${historyRows(h.items)}</div>`)}
function renderReviews(d,flagged){let rows=(d.reviews||[]).filter(r=>!flagged||r.suspicion_flag),stats=d.review_analytics||{};$('product-tab').innerHTML=`<div class="grid">${card(flagged?'Suspicious signals':'Review analytics',flagged?'<div class="notice">These signals deserve a closer look. They do not prove a review is fake, and genuine reviews can trigger rules.</div>'+fact('Flagged reviews',`${stats.flagged_count} of ${stats.review_count}`)+fact('Authenticity component',score((d.assessment.components.find(x=>x.key==='authenticity')||{}).score)):`<div class="grid"><div>${fact('Mean rating',score(d.product.mean_rating))+fact('Verified purchases',pct(d.product.verified_share))+fact('5-star share',pct(d.product.share_5star))+fact('1-star share',pct(d.product.share_1star))}</div><div>${fact('Positive sentiment',pct(d.product.sent_pos_share))+fact('Negative sentiment',pct(d.product.sent_neg_share))+fact('Sentiment scored',num(d.product.n_sentiment))}</div></div>`,'span-4')}${card(flagged?'Highest-suspicion reviews':'Review explorer',`<div class="toolbar"><select id="review-rating"><option value="">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><select id="review-sent"><option value="">All sentiment</option><option>positive</option><option>neutral</option><option>negative</option></select></div><div id="review-table">${reviewRows(rows)}</div>`,'span-8')}${flagged?card('Signal prevalence',Object.entries(stats.rule_rates||{}).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${v*100}%"></i></div><strong>${pct(v)}</strong></div>`).join(''),'span-12'):''}</div>`;function filter(){let r=d.reviews||[];if(flagged)r=r.filter(x=>x.suspicion_flag);if($('review-rating').value)r=r.filter(x=>x.rating==$('review-rating').value);if($('review-sent').value)r=r.filter(x=>x.sent_label==$('review-sent').value);$('review-table').innerHTML=reviewRows(r);document.querySelectorAll('[data-review]').forEach(x=>x.onclick=()=>openReview(d.product.parent_asin,x.dataset.review))}$('review-rating').onchange=filter;$('review-sent').onchange=filter;document.querySelectorAll('[data-review]').forEach(x=>x.onclick=()=>openReview(d.product.parent_asin,x.dataset.review))}function reviewRows(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Rating</th><th>Sentiment</th><th>Verified</th><th>Helpful</th><th>Suspicion</th><th>Review</th></tr></thead><tbody>${rows.slice(0,1000).map(r=>`<tr class="clickable" data-review="${esc(r.review_id)}"><td>${esc(r.timestamp?.slice(0,10))}</td><td>${r.rating}★</td><td>${esc(r.sent_label||'n/a')}</td><td>${r.verified_purchase?'Yes':'No'}</td><td>${num(r.helpful_vote)}</td><td><span class="pill ${r.suspicion_flag?'bad':''}">${Number(r.suspicion_score||0).toFixed(2)}</span></td><td class="review-text">${esc(((r.title?r.title+' — ':'')+(r.text||'')).slice(0,240))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No reviews match.</div>'}
async function openReview(asin,id){const d=await get(`/api/products/${encodeURIComponent(asin)}/reviews/${encodeURIComponent(id)}`),r=d.review;$('modal').className='modal';$('modal').innerHTML=`<div class="modal-box"><button class="modal-close" id="close-modal">×</button><div class="eyebrow">Review explanation</div><h2>${esc(r.title||'(no title)')}</h2><div class="chips"><span class="pill">${r.rating}★</span><span class="chip">${r.verified_purchase?'Verified':'Unverified'}</span><span class="chip">${num(r.helpful_vote)} helpful votes</span><span class="pill ${r.suspicion_flag?'bad':''}">Suspicion ${Number(r.suspicion_score||0).toFixed(2)}</span></div><p style="white-space:pre-wrap">${esc(r.text||'(no text)')}</p><hr><h3>Why was / wasn't this review flagged?</h3>${list((d.rules||[]).map(x=>x.label+': '+x.description),'No rule-based signals triggered.')}${d.anomaly?`<h3>Anomaly SHAP</h3>${componentBars(d.anomaly.items.map(x=>({label:x.feature,score:Math.min(100,Math.abs(x.shap)*100)})))}`:''}${d.helpfulness?`<h3>Predicted helpfulness: ${pct(d.helpfulness.prediction)}</h3>${componentBars(d.helpfulness.items.map(x=>({label:x.label,score:Math.min(100,Math.abs(x.shap)*100)})))}`:'<p class="muted">Helpfulness model not trained.</p>'}</div>`;$('close-modal').onclick=()=>{$('modal').className='hidden'}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setNav(b.dataset.view,b.textContent.trim(),{dashboard:' and evidence coverage',search:'Filter, inspect, and compare products',compare:'Side-by-side product evidence',history:'Every assessment run and reassessment',models:'Reproducibility and diagnostics',methodology:'Scoring framework and settings'}[b.dataset.view]));$('reload').onclick=()=>safe(()=>views[state.view]());setNav('dashboard','Dashboard',' and evidence coverage');
</script></body></html>
